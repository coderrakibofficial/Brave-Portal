# ============================================================
#  BRAVE Portal - central configuration (edit this file only)
# ============================================================
# Website that is loaded inside the app (must be https)
WEBSITE_URL=https://brave.coachkanchon.academy/
# Name shown under the launcher icon
APP_NAME=BRAVE Portal
# Android package id (applicationId). Must be unique on Google Play.
APP_ID=com.brave.portal
# Shown to users (VERSION_NAME). Increase VERSION_CODE by 1 for every Play Store upload.
VERSION_NAME=1.0.0
VERSION_CODE=1
# Optional: extra hosts that must stay INSIDE the app (comma separated, no spaces).
# Example: login.coachkanchon.academy,pay.coachkanchon.academy
EXTRA_INTERNAL_HOSTS=
# Push notifications: Firebase topic every app install subscribes to (must match the WordPress plugin)
FCM_TOPIC=brave-members
# Pull down at the top of a page to refresh (true/false)
PULL_TO_REFRESH=true
